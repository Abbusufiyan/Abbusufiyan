<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 240" width="100%" height="240" style="background: transparent;">
  <style>
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    @keyframes gradientShift {
      0% { stop-color: #00f0ff; }
      50% { stop-color: #38bdf8; }
      100% { stop-color: #00f0ff; }
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(1000%); }
    }

    @keyframes shimmerMove {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .cursor-blink {
      animation: cursorBlink 1.1s infinite steps(1);
    }

    .animated-pulse {
      animation: pulseGlow 4s ease-in-out infinite;
    }

    .float-item {
      animation: floatGentle 5s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      *, .cursor-blink, .animated-pulse, .float-item {
        animation: none !important;
        transition: none !important;
      }
    }

    
    @keyframes projectGlow {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(0, 240, 255, 0.25)); }
      50% { filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.65)); }
    }

    .proj-title {
      animation: projectGlow 5s ease-in-out infinite;
    }

    .text-title {
      font-family: 'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .text-sans {
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .text-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace;
    }
  </style>

  
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="proj_acer-control_bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#060a16"/>
    </linearGradient>

    <!-- Electric Accent Gradient -->
    <linearGradient id="proj_acer-control_accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glowing Accent Gradient for Border -->
    <linearGradient id="proj_acer-control_borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#152238" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#152238" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Subtle Cyan Ambient Radial Glow -->
    <radialGradient id="proj_acer-control_ambientGlow" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="proj_acer-control_cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="proj_acer-control_cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="proj_acer-control_techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00f0ff" stroke-opacity="0.03" stroke-width="0.8"/>
      <circle cx="24" cy="24" r="0.75" fill="#00f0ff" fill-opacity="0.08"/>
    </pattern>
  </defs>


  <!-- Main Card Container -->
  <rect x="2" y="2" width="426" height="236" rx="14" fill="url(#proj_acer-control_bgGradient)" stroke="url(#proj_acer-control_borderGradient)" stroke-width="1.5" filter="url(#proj_acer-control_cardShadow)"/>
  <rect x="2" y="2" width="426" height="236" rx="14" fill="url(#proj_acer-control_ambientGlow)" pointer-events="none"/>

  <!-- Top Status Badge &amp; Icon -->
  <g transform="translate(22, 22)">
    <!-- Category Icon -->
    <rect x="0" y="0" width="30" height="30" rx="8" fill="#08142a" stroke="#152238" stroke-width="1"/>
    <path d="M 12 2 v 2 M 12 20 v 2 M 4.93 4.93 l 1.41 1.41 M 17.66 17.66 l 1.41 1.41 M 2 12 h 2 M 20 12 h 2 M 4.93 19.07 l 1.41 -1.41 M 17.66 6.34 l 1.41 -1.41" fill="none" stroke="#00f0ff" stroke-width="1.3" transform="translate(4, 4) scale(0.9)"/>

    <!-- Badge -->
    <g transform="translate(236, 4)">
      <rect x="0" y="0" width="150" height="22" rx="11" fill="#08172c" stroke="#f59e0b" stroke-width="0.8" opacity="0.9"/>
      <circle cx="12" cy="11" r="3" fill="#f59e0b"/>
      <text x="22" y="14.5" class="text-mono" font-size="8.5" font-weight="600" fill="#f59e0b" letter-spacing="0.05em">KERNEL DRIVER / DKMS</text>
    </g>
  </g>

  <!-- Project Name &amp; Subtitle -->
  <g transform="translate(22, 82)">
    <text class="text-title proj-title" font-size="22" fill="#f8fafc">
      ACER ALG CENTER
    </text>
    <text x="0" y="20" class="text-mono" font-size="9.5" fill="#38bdf8" letter-spacing="0.08em">
      LINUX HARDWARE UTILITY &amp; GUI
    </text>
    <line x1="0" y1="28" x2="386" y2="28" stroke="#152238" stroke-width="0.8"/>
  </g>

  <!-- Short Description -->
  <g transform="translate(22, 132)" class="text-sans" font-size="11.5" fill="#94a3b8">
    <text x="0" y="0">Native Linux utility for Acer ALG laptops: 16-color RGB keyboard,</text>
    <text x="0" y="18" fill="#64748b">independent dual-fan governor &amp; real-time RTX telemetry.</text>
  </g>

  <!-- Tech Stack Pills -->
  
      <g transform="translate(22, 186)">
        <rect x="0" y="0" width="68.0" height="20" rx="10" fill="#091326" stroke="#152238" stroke-width="0.8"/>
        <text x="34.0" y="13.5" class="text-mono" font-size="9" fill="#94a3b8" text-anchor="middle">Python 3</text>
      </g>

      <g transform="translate(96.0, 186)">
        <rect x="0" y="0" width="48.5" height="20" rx="10" fill="#091326" stroke="#152238" stroke-width="0.8"/>
        <text x="24.25" y="13.5" class="text-mono" font-size="9" fill="#94a3b8" text-anchor="middle">PyQt6</text>
      </g>

      <g transform="translate(150.5, 186)">
        <rect x="0" y="0" width="87.5" height="20" rx="10" fill="#091326" stroke="#152238" stroke-width="0.8"/>
        <text x="43.75" y="13.5" class="text-mono" font-size="9" fill="#94a3b8" text-anchor="middle">ACPI Driver</text>
      </g>

      <g transform="translate(244.0, 186)">
        <rect x="0" y="0" width="42" height="20" rx="10" fill="#091326" stroke="#152238" stroke-width="0.8"/>
        <text x="21.0" y="13.5" class="text-mono" font-size="9" fill="#94a3b8" text-anchor="middle">DKMS</text>
      </g>

      <g transform="translate(292.0, 186)">
        <rect x="0" y="0" width="87.5" height="20" rx="10" fill="#091326" stroke="#152238" stroke-width="0.8"/>
        <text x="43.75" y="13.5" class="text-mono" font-size="9" fill="#94a3b8" text-anchor="middle">Linux Sysfs</text>
      </g>

  <!-- Bottom Action Cue -->
  <g transform="translate(406, 222)">
    <text x="0" y="0" class="text-mono" font-size="9.5" font-weight="600" fill="#00f0ff" text-anchor="end" letter-spacing="0.06em">
      INSPECT HARDWARE REPO →
    </text>
  </g>
</svg>
