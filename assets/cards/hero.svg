<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="340" style="background: transparent;">
  <style>
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    @keyframes gradientShift {
      0% { stop-color: #00f0ff; }
      50% { stop-color: #38bdf8; }
      100% { stop-color: #00f0ff; }
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(1000%); }
    }

    @keyframes shimmerMove {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .cursor-blink {
      animation: cursorBlink 1.1s infinite steps(1);
    }

    .animated-pulse {
      animation: pulseGlow 4s ease-in-out infinite;
    }

    .float-item {
      animation: floatGentle 5s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      *, .cursor-blink, .animated-pulse, .float-item {
        animation: none !important;
        transition: none !important;
      }
    }

    
    @keyframes nameGlow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(0, 240, 255, 0.4)); }
      50% { filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.85)); }
    }

    @keyframes statusPulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    @keyframes textShimmer {
      0% { fill-opacity: 0.9; }
      50% { fill-opacity: 1; }
      100% { fill-opacity: 0.9; }
    }

    @keyframes borderTrace {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    .hero-name {
      animation: nameGlow 5s ease-in-out infinite;
    }

    .status-dot {
      animation: statusPulse 2s ease-in-out infinite;
      transform-origin: 45px 38px;
    }

    .shimmer-text {
      animation: textShimmer 3s ease-in-out infinite;
    }

    .text-title {
      font-family: 'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .text-sans {
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .text-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace;
    }
  </style>

  
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="hero_bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#060a16"/>
    </linearGradient>

    <!-- Electric Accent Gradient -->
    <linearGradient id="hero_accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glowing Accent Gradient for Border -->
    <linearGradient id="hero_borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#152238" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#152238" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Subtle Cyan Ambient Radial Glow -->
    <radialGradient id="hero_ambientGlow" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="hero_cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="hero_cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="hero_techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00f0ff" stroke-opacity="0.03" stroke-width="0.8"/>
      <circle cx="24" cy="24" r="0.75" fill="#00f0ff" fill-opacity="0.08"/>
    </pattern>
  </defs>


  <!-- Main Card Container -->
  <rect x="2" y="2" width="876" height="336" rx="16" fill="url(#hero_bgGradient)" stroke="url(#hero_borderGradient)" stroke-width="1.5" filter="url(#hero_cardShadow)"/>
  <rect x="2" y="2" width="876" height="336" rx="16" fill="url(#hero_ambientGlow)" pointer-events="none"/>
  <rect x="2" y="2" width="876" height="336" rx="16" fill="url(#hero_techGrid)" pointer-events="none"/>

  <!-- Top System Header Bar -->
  <g class="text-mono" font-size="11" fill="#64748b">
    <!-- Status Indicator -->
    <circle cx="45" cy="38" r="5" fill="#00f0ff" opacity="0.3"/>
    <circle cx="45" cy="38" r="3.2" fill="#00f0ff" class="status-dot"/>
    <text x="58" y="42" font-weight="600" fill="#00f0ff" letter-spacing="0.08em">SYSTEM ACTIVE</text>
    <text x="180" y="42" fill="#64748b" opacity="0.5">|</text>
    <text x="195" y="42" fill="#94a3b8">ROLE: FULL-STACK &amp; SYSTEMS</text>

    <!-- Right Header Telemetry -->
    <text x="835" y="42" text-anchor="end" fill="#64748b">CORE :: LINUX x86_64</text>
    <line x1="30" y1="58" x2="850" y2="58" stroke="#152238" stroke-width="1"/>
  </g>

  <!-- Corner Tech Crosshairs -->
  <g stroke="#00f0ff" stroke-width="1" opacity="0.4">
    <path d="M 20 25 L 20 18 L 27 18"/>
    <path d="M 860 25 L 860 18 L 853 18"/>
    <path d="M 20 315 L 20 322 L 27 322"/>
    <path d="M 860 315 L 860 322 L 853 322"/>
  </g>

  <!-- Primary Headline Section -->
  <!-- Name with Serif Elegance -->
  <g transform="translate(45, 118)">
    <text class="text-title hero-name" font-size="46" fill="#f8fafc">
      ABU SUFIYAN
    </text>
    <!-- Cyan Shimmer Accent bar below name -->
    <rect x="2" y="14" width="220" height="3" rx="1.5" fill="url(#hero_accentGradient)"/>
    <circle cx="232" cy="15.5" r="2.5" fill="#00f0ff"/>
  </g>

  <!-- Title / Designation -->
  <g transform="translate(46, 168)" class="text-sans">
    <text font-size="15" font-weight="600" fill="#38bdf8" letter-spacing="0.12em">
      SOFTWARE DEVELOPER <tspan fill="#64748b">|</tspan> SOFTWARE ENGINEERING STUDENT
    </text>
  </g>

  <!-- Terminal Console Box -->
  <g transform="translate(45, 192)">
    <!-- Terminal Background -->
    <rect x="0" y="0" width="790" height="114" rx="10" fill="#050811" stroke="#152238" stroke-width="1"/>

    <!-- Terminal Window Controls -->
    <circle cx="18" cy="18" r="4.5" fill="#ef4444" opacity="0.75"/>
    <circle cx="34" cy="18" r="4.5" fill="#f59e0b" opacity="0.75"/>
    <circle cx="50" cy="18" r="4.5" fill="#10b981" opacity="0.75"/>
    <text x="75" y="22" class="text-mono" font-size="11" fill="#64748b">bash — dev-profile — 80x24</text>
    <line x1="0" y1="34" x2="790" y2="34" stroke="#152238" stroke-width="0.8"/>

    <!-- Terminal Content -->
    <g class="text-mono" font-size="12">
      <!-- Command prompt -->
      <text x="20" y="56" fill="#00f0ff" font-weight="600">$</text>
      <text x="36" y="56" fill="#f8fafc">sufiyan --info</text>
      <text x="170" y="56" fill="#64748b">--target production</text>

      <!-- Output Line 1 -->
      <text x="20" y="78" fill="#94a3b8">
        &gt; Architecting scalable web applications, interactive 3D WebGL experiences &amp; native Linux utilities.
      </text>

      <!-- Output Line 2 with typing cursor -->
      <text x="20" y="99" fill="#64748b">
        &gt; Core Stack: <tspan fill="#38bdf8">React</tspan> • <tspan fill="#38bdf8">TypeScript</tspan> • <tspan fill="#38bdf8">Node.js</tspan> • <tspan fill="#38bdf8">C++</tspan> • <tspan fill="#38bdf8">Three.js</tspan> • <tspan fill="#38bdf8">Tailwind</tspan>
      </text>
      <rect x="475" y="87" width="8" height="14" fill="#00f0ff" class="cursor-blink"/>
    </g>
  </g>

  <!-- Right Geometric Tech Emblem -->
  <g transform="translate(735, 78)">
    <!-- Tech Insignia Hexagon Wireframe -->
    <polygon points="45,0 90,26 90,78 45,104 0,78 0,26" fill="#091224" stroke="#00f0ff" stroke-width="1.2" opacity="0.7"/>
    <polygon points="45,10 78,29 78,69 45,88 12,69 12,29" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.4" stroke-dasharray="3,3"/>
    
    <!-- Monogram AS in Serif -->
    <text x="45" y="58" class="text-title" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="0.1em">
      AS
    </text>
    <text x="45" y="74" class="text-mono" font-size="8.5" fill="#00f0ff" text-anchor="middle" letter-spacing="0.18em">
      DEV // 2026
    </text>
  </g>
</svg>
