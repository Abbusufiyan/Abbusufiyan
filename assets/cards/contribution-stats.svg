<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="100%" height="290" style="background: transparent;">
  <style>
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    @keyframes gradientShift {
      0% { stop-color: #00f0ff; }
      50% { stop-color: #38bdf8; }
      100% { stop-color: #00f0ff; }
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(1000%); }
    }

    @keyframes shimmerMove {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .cursor-blink {
      animation: cursorBlink 1.1s infinite steps(1);
    }

    .animated-pulse {
      animation: pulseGlow 4s ease-in-out infinite;
    }

    .float-item {
      animation: floatGentle 5s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      *, .cursor-blink, .animated-pulse, .float-item {
        animation: none !important;
        transition: none !important;
      }
    }

    
    @keyframes barRise {
      from { transform: scaleY(0.05); }
      to { transform: scaleY(1); }
    }

    @keyframes statGlow {
      0%, 100% { filter: drop-shadow(0 0 3px rgba(0, 240, 255, 0.3)); }
      50% { filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.7)); }
    }

    .metric-value {
      animation: statGlow 4s ease-in-out infinite;
    }

    .chart-bar {
      transform-origin: bottom;
      animation: barRise 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .text-title {
      font-family: 'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .text-sans {
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .text-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace;
    }
  </style>

  
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="stats_bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#060a16"/>
    </linearGradient>

    <!-- Electric Accent Gradient -->
    <linearGradient id="stats_accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glowing Accent Gradient for Border -->
    <linearGradient id="stats_borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#152238" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#152238" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Subtle Cyan Ambient Radial Glow -->
    <radialGradient id="stats_ambientGlow" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="stats_cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="stats_cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="stats_techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00f0ff" stroke-opacity="0.03" stroke-width="0.8"/>
      <circle cx="24" cy="24" r="0.75" fill="#00f0ff" fill-opacity="0.08"/>
    </pattern>
  </defs>


  <!-- Main Card Container -->
  <rect x="2" y="2" width="876" height="286" rx="16" fill="url(#stats_bgGradient)" stroke="url(#stats_borderGradient)" stroke-width="1.5" filter="url(#stats_cardShadow)"/>
  <rect x="2" y="2" width="876" height="286" rx="16" fill="url(#stats_ambientGlow)" pointer-events="none"/>

  <!-- Card Header -->
  <g transform="translate(30, 34)">
    <circle cx="6" cy="6" r="4" fill="#00f0ff"/>
    <text x="20" y="10" class="text-title" font-size="19" fill="#f8fafc">
      CONTRIBUTION ACTIVITY &amp; METRICS
    </text>
    <text x="820" y="10" class="text-mono" font-size="10.5" fill="#64748b" text-anchor="end">
      LIVE TELEMETRY // REAL GITHUB DATA
    </text>
    <line x1="0" y1="20" x2="820" y2="20" stroke="#152238" stroke-width="1"/>
  </g>

  <!-- KPI Cards Row -->
  
    <!-- KPI: TOTAL COMMITS -->
    <g transform="translate(30, 66)">
      <rect x="0" y="0" width="156" height="80" rx="8" fill="#070c18" stroke="#152238" stroke-width="1"/>
      <rect x="0" y="0" width="156" height="2" rx="1" fill="#00f0ff" opacity="0.8"/>
      <text x="12" y="22" class="text-mono" font-size="9" fill="#64748b" letter-spacing="0.08em">TOTAL COMMITS</text>
      <text x="12" y="52" class="text-mono metric-value" font-size="22" font-weight="700" fill="#00f0ff">226</text>
      <text x="12" y="68" class="text-sans" font-size="9.5" fill="#64748b">Last 12 Months</text>
    </g>

    <!-- KPI: ACTIVE DAYS -->
    <g transform="translate(194, 66)">
      <rect x="0" y="0" width="156" height="80" rx="8" fill="#070c18" stroke="#152238" stroke-width="1"/>
      <rect x="0" y="0" width="156" height="2" rx="1" fill="#38bdf8" opacity="0.8"/>
      <text x="12" y="22" class="text-mono" font-size="9" fill="#64748b" letter-spacing="0.08em">ACTIVE DAYS</text>
      <text x="12" y="52" class="text-mono metric-value" font-size="22" font-weight="700" fill="#38bdf8">44</text>
      <text x="12" y="68" class="text-sans" font-size="9.5" fill="#64748b">Commit Days</text>
    </g>

    <!-- KPI: CURRENT STREAK -->
    <g transform="translate(358, 66)">
      <rect x="0" y="0" width="156" height="80" rx="8" fill="#070c18" stroke="#152238" stroke-width="1"/>
      <rect x="0" y="0" width="156" height="2" rx="1" fill="#10b981" opacity="0.8"/>
      <text x="12" y="22" class="text-mono" font-size="9" fill="#64748b" letter-spacing="0.08em">CURRENT STREAK</text>
      <text x="12" y="52" class="text-mono metric-value" font-size="22" font-weight="700" fill="#10b981">7d</text>
      <text x="12" y="68" class="text-sans" font-size="9.5" fill="#64748b">Consistent Activity</text>
    </g>

    <!-- KPI: LONGEST STREAK -->
    <g transform="translate(522, 66)">
      <rect x="0" y="0" width="156" height="80" rx="8" fill="#070c18" stroke="#152238" stroke-width="1"/>
      <rect x="0" y="0" width="156" height="2" rx="1" fill="#f59e0b" opacity="0.8"/>
      <text x="12" y="22" class="text-mono" font-size="9" fill="#64748b" letter-spacing="0.08em">LONGEST STREAK</text>
      <text x="12" y="52" class="text-mono metric-value" font-size="22" font-weight="700" fill="#f59e0b">12d</text>
      <text x="12" y="68" class="text-sans" font-size="9.5" fill="#64748b">Peak Continuity</text>
    </g>

    <!-- KPI: BUSIEST DAY -->
    <g transform="translate(686, 66)">
      <rect x="0" y="0" width="156" height="80" rx="8" fill="#070c18" stroke="#152238" stroke-width="1"/>
      <rect x="0" y="0" width="156" height="2" rx="1" fill="#00f0ff" opacity="0.8"/>
      <text x="12" y="22" class="text-mono" font-size="9" fill="#64748b" letter-spacing="0.08em">BUSIEST DAY</text>
      <text x="12" y="52" class="text-mono metric-value" font-size="22" font-weight="700" fill="#00f0ff">28</text>
      <text x="12" y="68" class="text-sans" font-size="9.5" fill="#64748b">Nov 8</text>
    </g>

  <!-- Monthly Breakdown Chart -->
  <g>
    <!-- Chart baseline -->
    <line x1="30" y1="250" x2="850" y2="250" stroke="#152238" stroke-width="1"/>
    
      <!-- Month: Dec 25 -->
      
      <rect x="50.166666666666664" y="247" width="28" height="3" rx="3" fill="#10192e" opacity="0.4" class="chart-bar"/>
      <text x="64.16666666666666" y="266" class="text-mono" font-size="9" fill="#64748b" text-anchor="middle">Dec 25</text>

      <!-- Month: Jan 26 -->
      
      <rect x="118.5" y="247" width="28" height="3" rx="3" fill="#10192e" opacity="0.4" class="chart-bar"/>
      <text x="132.5" y="266" class="text-mono" font-size="9" fill="#64748b" text-anchor="middle">Jan 26</text>

      <!-- Month: Feb 26 -->
      
      <rect x="186.83333333333331" y="247" width="28" height="3" rx="3" fill="#10192e" opacity="0.4" class="chart-bar"/>
      <text x="200.83333333333331" y="266" class="text-mono" font-size="9" fill="#64748b" text-anchor="middle">Feb 26</text>

      <!-- Month: Mar 26 -->
      <text x="269.16666666666663" y="213" class="text-mono" font-size="8.5" fill="#00f0ff" text-anchor="middle">56</text>
      <rect x="255.16666666666666" y="217" width="28" height="33" rx="3" fill="#00f0ff" opacity="1" class="chart-bar"/>
      <text x="269.16666666666663" y="266" class="text-mono" font-size="9" fill="#64748b" text-anchor="middle">Mar 26</text>

      <!-- Month: Apr 26 -->
      
      <rect x="323.5" y="247" width="28" height="3" rx="3" fill="#10192e" opacity="0.4" class="chart-bar"/>
      <text x="337.5" y="266" class="text-mono" font-size="9" fill="#64748b" text-anchor="middle">Apr 26</text>

      <!-- Month: May 26 -->
      <text x="405.8333333333333" y="241" class="text-mono" font-size="8.5" fill="#00f0ff" text-anchor="middle">9</text>
      <rect x="391.8333333333333" y="245" width="28" height="5" rx="3" fill="#3b82f6" opacity="1" class="chart-bar"/>
      <text x="405.8333333333333" y="266" class="text-mono" font-size="9" fill="#64748b" text-anchor="middle">May 26</text>

      <!-- Month: Jun 26 -->
      
      <rect x="460.1666666666667" y="247" width="28" height="3" rx="3" fill="#10192e" opacity="0.4" class="chart-bar"/>
      <text x="474.1666666666667" y="266" class="text-mono" font-size="9" fill="#64748b" text-anchor="middle">Jun 26</text>

      <!-- Month: Jul 26 -->
      
      <rect x="528.5" y="247" width="28" height="3" rx="3" fill="#10192e" opacity="0.4" class="chart-bar"/>
      <text x="542.5" y="266" class="text-mono" font-size="9" fill="#64748b" text-anchor="middle">Jul 26</text>

      <!-- Month: Aug 26 -->
      <text x="610.8333333333333" y="241" class="text-mono" font-size="8.5" fill="#00f0ff" text-anchor="middle">10</text>
      <rect x="596.8333333333333" y="245" width="28" height="5" rx="3" fill="#3b82f6" opacity="1" class="chart-bar"/>
      <text x="610.8333333333333" y="266" class="text-mono" font-size="9" fill="#64748b" text-anchor="middle">Aug 26</text>

      <!-- Month: Sep 26 -->
      <text x="679.1666666666666" y="233" class="text-mono" font-size="8.5" fill="#00f0ff" text-anchor="middle">22</text>
      <rect x="665.1666666666666" y="237" width="28" height="13" rx="3" fill="#38bdf8" opacity="1" class="chart-bar"/>
      <text x="679.1666666666666" y="266" class="text-mono" font-size="9" fill="#64748b" text-anchor="middle">Sep 26</text>

      <!-- Month: Oct 26 -->
      <text x="747.4999999999999" y="227" class="text-mono" font-size="8.5" fill="#00f0ff" text-anchor="middle">32</text>
      <rect x="733.4999999999999" y="231" width="28" height="19" rx="3" fill="#00f0ff" opacity="1" class="chart-bar"/>
      <text x="747.4999999999999" y="266" class="text-mono" font-size="9" fill="#64748b" text-anchor="middle">Oct 26</text>

      <!-- Month: Nov 26 -->
      <text x="815.8333333333333" y="188" class="text-mono" font-size="8.5" fill="#00f0ff" text-anchor="middle">97</text>
      <rect x="801.8333333333333" y="192" width="28" height="58" rx="3" fill="#00f0ff" opacity="1" class="chart-bar"/>
      <text x="815.8333333333333" y="266" class="text-mono" font-size="9" fill="#64748b" text-anchor="middle">Nov 26</text>
  </g>
</svg>
