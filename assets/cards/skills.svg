<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="100%" height="380" style="background: transparent;">
  <style>
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    @keyframes gradientShift {
      0% { stop-color: #00f0ff; }
      50% { stop-color: #38bdf8; }
      100% { stop-color: #00f0ff; }
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(1000%); }
    }

    @keyframes shimmerMove {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .cursor-blink {
      animation: cursorBlink 1.1s infinite steps(1);
    }

    .animated-pulse {
      animation: pulseGlow 4s ease-in-out infinite;
    }

    .float-item {
      animation: floatGentle 5s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      *, .cursor-blink, .animated-pulse, .float-item {
        animation: none !important;
        transition: none !important;
      }
    }

    
    @keyframes pillPulse {
      0%, 100% { border-color: #152238; }
      50% { border-color: #00f0ff; }
    }

    @keyframes iconGlow {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(0, 240, 255, 0.2)); }
      50% { filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.7)); }
    }

    .cat-icon {
      animation: iconGlow 4s ease-in-out infinite;
    }

    .text-title {
      font-family: 'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .text-sans {
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .text-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace;
    }
  </style>

  
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="skills_bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#060a16"/>
    </linearGradient>

    <!-- Electric Accent Gradient -->
    <linearGradient id="skills_accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glowing Accent Gradient for Border -->
    <linearGradient id="skills_borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#152238" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#152238" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Subtle Cyan Ambient Radial Glow -->
    <radialGradient id="skills_ambientGlow" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="skills_cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="skills_cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="skills_techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00f0ff" stroke-opacity="0.03" stroke-width="0.8"/>
      <circle cx="24" cy="24" r="0.75" fill="#00f0ff" fill-opacity="0.08"/>
    </pattern>
  </defs>


  <!-- Main Card Container -->
  <rect x="2" y="2" width="876" height="376" rx="16" fill="url(#skills_bgGradient)" stroke="url(#skills_borderGradient)" stroke-width="1.5" filter="url(#skills_cardShadow)"/>
  <rect x="2" y="2" width="876" height="376" rx="16" fill="url(#skills_ambientGlow)" pointer-events="none"/>

  <!-- Card Header -->
