<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="100%" height="190" style="background: transparent;">
  <style>
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    @keyframes gradientShift {
      0% { stop-color: #00f0ff; }
      50% { stop-color: #38bdf8; }
      100% { stop-color: #00f0ff; }
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(1000%); }
    }

    @keyframes shimmerMove {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .cursor-blink {
      animation: cursorBlink 1.1s infinite steps(1);
    }

    .animated-pulse {
      animation: pulseGlow 4s ease-in-out infinite;
    }

    .float-item {
      animation: floatGentle 5s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      *, .cursor-blink, .animated-pulse, .float-item {
        animation: none !important;
        transition: none !important;
      }
    }

    
    @keyframes linkGlow {
      0%, 100% { border-color: #152238; }
      50% { border-color: #00f0ff; }
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .online-dot {
      animation: dotPulse 2s ease-in-out infinite;
    }

    .text-title {
      font-family: 'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .text-sans {
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .text-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, 'Courier New', monospace;
    }
  </style>

  
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="connect_bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#060a16"/>
    </linearGradient>

    <!-- Electric Accent Gradient -->
    <linearGradient id="connect_accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glowing Accent Gradient for Border -->
    <linearGradient id="connect_borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#152238" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#152238" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Subtle Cyan Ambient Radial Glow -->
    <radialGradient id="connect_ambientGlow" cx="20%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="connect_cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="connect_cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="connect_techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00f0ff" stroke-opacity="0.03" stroke-width="0.8"/>
      <circle cx="24" cy="24" r="0.75" fill="#00f0ff" fill-opacity="0.08"/>
    </pattern>
  </defs>


  <!-- Main Card Container -->
  <rect x="2" y="2" width="876" height="186" rx="16" fill="url(#connect_bgGradient)" stroke="url(#connect_borderGradient)" stroke-width="1.5" filter="url(#connect_cardShadow)"/>
  <rect x="2" y="2" width="876" height="186" rx="16" fill="url(#connect_ambientGlow)" pointer-events="none"/>

  <!-- Card Header -->
  <g transform="translate(30, 34)">
    <circle cx="6" cy="6" r="4" fill="#00f0ff"/>
    <text x="20" y="10" class="text-title" font-size="19" fill="#f8fafc">
      CONNECT &amp; COLLABORATE
    </text>
    <text x="820" y="10" class="text-mono" font-size="10.5" fill="#64748b" text-anchor="end">
      OPEN FOR NEW OPPORTUNITIES
    </text>
    <line x1="0" y1="20" x2="820" y2="20" stroke="#152238" stroke-width="1"/>
  </g>

  <!-- Channels Grid -->
  
    <!-- Channel: GITHUB -->
    <g transform="translate(30, 72)">
      <rect x="0" y="0" width="196" height="86" rx="10" fill="#070c18" stroke="#152238" stroke-width="1"/>
      <rect x="0" y="0" width="196" height="2" rx="1" fill="#00f0ff" opacity="0.8"/>

      <!-- Icon Box -->
      <rect x="12" y="14" width="28" height="28" rx="6" fill="#0a1529" stroke="#152238" stroke-width="0.8"/>
      <path d="M 9 19 c -5 1.5 -5 -2.5 -7 -3 m 14 6 v -3.87 a 3.37 3.37 0 0 0 -0.94 -2.61 c 3.14 -0.35 6.44 -1.54 6.44 -7 A 5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1 S 18.73 0.65 16 2.48 a 13.38 13.38 0 0 0 -7 0 C 6.27 0.65 5.09 1 5.09 1 A 5.07 5.07 0 0 0 5 4.77 a 5.44 5.44 0 0 0 -1.5 3.78 c 0 5.42 3.3 6.61 6.44 7 A 3.37 3.37 0 0 0 9 18.13 V 22" fill="none" stroke="#00f0ff" stroke-width="1.3" transform="translate(14, 16) scale(1)"/>

      <!-- Texts -->
      <text x="50" y="24" class="text-mono" font-size="10" font-weight="700" fill="#f8fafc" letter-spacing="0.06em">GITHUB</text>
      <text x="50" y="38" class="text-mono" font-size="9" fill="#00f0ff">@Abbusufiyan</text>

      <!-- Subtitle -->
      <text x="12" y="66" class="text-sans" font-size="9" fill="#64748b">25 Repositories</text>

      <!-- Status dot -->
      <circle cx="182" cy="16" r="3" fill="#00f0ff" class="online-dot"/>
    </g>

    <!-- Channel: LINKEDIN -->
    <g transform="translate(238, 72)">
      <rect x="0" y="0" width="196" height="86" rx="10" fill="#070c18" stroke="#152238" stroke-width="1"/>
      <rect x="0" y="0" width="196" height="2" rx="1" fill="#38bdf8" opacity="0.8"/>

      <!-- Icon Box -->
      <rect x="12" y="14" width="28" height="28" rx="6" fill="#0a1529" stroke="#152238" stroke-width="0.8"/>
      <path d="M 16 8 a 6 6 0 0 1 6 6 v 7 h -4 v -7 a 2 2 0 0 0 -2 -2 2 2 0 0 0 -2 2 v 7 h -4 v -7 a 6 6 0 0 1 6 -6 z M 2 9 h 4 v 12 H 2 z M 4 2 a 2 2 0 1 1 -2 2 a 2 2 0 0 1 2 -2 z" fill="none" stroke="#38bdf8" stroke-width="1.3" transform="translate(14, 16) scale(1)"/>

      <!-- Texts -->
      <text x="50" y="24" class="text-mono" font-size="10" font-weight="700" fill="#f8fafc" letter-spacing="0.06em">LINKEDIN</text>
      <text x="50" y="38" class="text-mono" font-size="9" fill="#38bdf8">in/abu-sufiyan</text>

      <!-- Subtitle -->
      <text x="12" y="66" class="text-sans" font-size="9" fill="#64748b">Professional Network</text>

      <!-- Status dot -->
      <circle cx="182" cy="16" r="3" fill="#38bdf8" class="online-dot"/>
    </g>

    <!-- Channel: PORTFOLIO -->
    <g transform="translate(446, 72)">
      <rect x="0" y="0" width="196" height="86" rx="10" fill="#070c18" stroke="#152238" stroke-width="1"/>
      <rect x="0" y="0" width="196" height="2" rx="1" fill="#10b981" opacity="0.8"/>

      <!-- Icon Box -->
      <rect x="12" y="14" width="28" height="28" rx="6" fill="#0a1529" stroke="#152238" stroke-width="0.8"/>
      <path d="M 12 2 a 10 10 0 1 0 10 10 A 10 10 0 0 0 12 2 z M 2 12 h 20 M 12 2 a 15.3 15.3 0 0 1 4 10 a 15.3 15.3 0 0 1 -4 10 a 15.3 15.3 0 0 1 -4 -10 a 15.3 15.3 0 0 1 4 -10 z" fill="none" stroke="#10b981" stroke-width="1.3" transform="translate(14, 16) scale(1)"/>

      <!-- Texts -->
      <text x="50" y="24" class="text-mono" font-size="10" font-weight="700" fill="#f8fafc" letter-spacing="0.06em">PORTFOLIO</text>
      <text x="50" y="38" class="text-mono" font-size="9" fill="#10b981">Interactive 3D</text>

      <!-- Subtitle -->
      <text x="12" y="66" class="text-sans" font-size="9" fill="#64748b">Live WebGL Showcase</text>

      <!-- Status dot -->
      <circle cx="182" cy="16" r="3" fill="#10b981" class="online-dot"/>
    </g>

    <!-- Channel: LEETCODE -->
    <g transform="translate(654, 72)">
      <rect x="0" y="0" width="196" height="86" rx="10" fill="#070c18" stroke="#152238" stroke-width="1"/>
      <rect x="0" y="0" width="196" height="2" rx="1" fill="#f59e0b" opacity="0.8"/>

      <!-- Icon Box -->
      <rect x="12" y="14" width="28" height="28" rx="6" fill="#0a1529" stroke="#152238" stroke-width="0.8"/>
      <path d="M 16 3 L 6 13 L 16 23 M 12 13 H 22" fill="none" stroke="#f59e0b" stroke-width="1.3" transform="translate(14, 16) scale(1)"/>

      <!-- Texts -->
      <text x="50" y="24" class="text-mono" font-size="10" font-weight="700" fill="#f8fafc" letter-spacing="0.06em">LEETCODE</text>
      <text x="50" y="38" class="text-mono" font-size="9" fill="#f59e0b">BUHw5Vatuj</text>

      <!-- Subtitle -->
      <text x="12" y="66" class="text-sans" font-size="9" fill="#64748b">DSA &amp; Problem Solving</text>

      <!-- Status dot -->
      <circle cx="182" cy="16" r="3" fill="#f59e0b" class="online-dot"/>
    </g>
</svg>
