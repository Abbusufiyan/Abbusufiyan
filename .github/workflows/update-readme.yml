name: Update Profile Cards & Activity

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  refresh-cards:
    name: Refresh Contributions & Cards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Live GitHub Contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_contributions.py

      - name: Render Animated SVG Cards
        run: |
          python scripts/render_readme_cards.py

      - name: Validate Generated SVG Cards
        run: |
          python scripts/test_svgs.py

      - name: Commit and Push if Changed
        run: |
          git status --short
          if git diff --quiet data/contributions.json assets/cards/; then
            echo "No changes detected in contributions or generated SVG cards. Skipping commit."
          else
            echo "Changes detected. Staging and committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/contributions.json assets/cards/
            git commit -m "chore(telemetry): update GitHub contributions & animated cards [skip ci]"
            git push
          fi
